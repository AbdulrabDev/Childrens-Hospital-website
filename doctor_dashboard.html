<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doktor Paneli – Çocuk Hastanesi</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#0A6EBD;--primary-dark:#054F8A;--primary-light:#E8F4FF;--teal:#00B4A6;--accent:#FF6B35;--danger:#E53935;--text-dark:#0D1B2A;--text-mid:#3D5268;--text-light:#7A92A8;--white:#FFFFFF;--bg:#F5F9FD;--border:rgba(10,110,189,0.12);--shadow-sm:0 2px 12px rgba(10,110,189,0.08);--shadow-md:0 8px 32px rgba(10,110,189,0.14);--radius:16px;--radius-sm:8px;--transition:all 0.35s cubic-bezier(0.4,0,0.2,1);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-dark);}
        header{background:linear-gradient(135deg,var(--primary-dark),var(--primary));padding:0;position:relative;overflow:hidden;}
        .header-inner{max-width:1400px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}
        .header-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--white);}
        .logout-btn{background:rgba(255,255,255,0.15);color:var(--white);border:1.5px solid rgba(255,255,255,0.35);padding:8px 18px;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:6px;}
        .logout-btn:hover{background:var(--white);color:var(--primary);}
        nav{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
        .nav-inner{max-width:1400px;margin:0 auto;padding:0 32px;display:flex;align-items:center;}
        nav ul{list-style:none;display:flex;gap:2px;}
        nav ul li{position:relative;}
        nav a{display:block;color:var(--text-mid);text-decoration:none;padding:14px 12px;font-size:0.84rem;font-weight:500;transition:var(--transition);position:relative;white-space:nowrap;}
        nav a:hover{color:var(--primary);}
        nav ul li ul{display:none;position:absolute;top:calc(100% + 2px);left:0;background:var(--white);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-md);width:200px;overflow:hidden;z-index:200;}
        nav ul li:hover ul{display:block;}
        nav ul li ul li{display:block;}
        nav ul li ul a{padding:9px 14px;font-size:0.82rem;border-bottom:1px solid var(--border);}
        nav ul li ul a:hover{background:var(--primary-light);color:var(--primary);}
        nav ul li ul li:last-child a{border-bottom:none;}
        .main{max-width:1400px;margin:32px auto;padding:0 32px;display:grid;grid-template-columns:1fr;gap:24px;}
        .panel-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;}
        .panel-card-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
        .panel-icon{width:40px;height:40px;background:var(--primary-light);border-radius:10px;display:flex;align-items:center;justify-content:center;}
        .panel-icon svg{width:18px;height:18px;color:var(--primary);}
        .panel-card-header h2{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--text-dark);}
        .panel-body{padding:24px;}
        .form-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:16px;}
        label{display:block;font-size:0.78rem;font-weight:600;color:var(--text-mid);margin-bottom:5px;}
        select,input[type="date"]{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:0.88rem;color:var(--text-dark);background:var(--bg);outline:none;transition:var(--transition);}
        select:focus,input[type="date"]:focus{border-color:var(--primary);background:var(--white);box-shadow:0 0 0 3px rgba(10,110,189,0.1);}
        .btn-add{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:var(--white);border:none;padding:11px 24px;border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:0.88rem;font-weight:600;cursor:pointer;transition:var(--transition);}
        .btn-add:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(10,110,189,0.3);}
        table{width:100%;border-collapse:collapse;}
        thead th{background:var(--primary);color:var(--white);padding:11px 14px;text-align:left;font-size:0.8rem;font-weight:600;}
        thead th:first-child{border-radius:8px 0 0 8px;}
        thead th:last-child{border-radius:0 8px 8px 0;}
        tbody td{padding:11px 14px;font-size:0.85rem;color:var(--text-mid);border-bottom:1px solid var(--border);}
        tbody tr:last-child td{border-bottom:none;}
        tbody tr:hover{background:var(--primary-light);}
        .btn-delete{background:none;border:1.5px solid var(--danger);color:var(--danger);padding:4px 12px;border-radius:6px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:var(--transition);}
        .btn-delete:hover{background:var(--danger);color:var(--white);}
        .empty-msg{text-align:center;color:var(--text-light);padding:32px;font-size:0.88rem;}
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="header-title">Doktor Paneli</div>
            <button class="logout-btn" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                Çıkış Yap
            </button>
        </div>
    </header>
    <nav>
        <div class="nav-inner">
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="#">Bölümlerimiz ▾</a>
                    <ul>
                        <li><a href="sections/emergency.html" target="_blank">Çocuk Acil Servisi</a></li>
                        <li><a href="sections/icu.html" target="_blank">Çocuk Yoğun Bakım</a></li>
                        <li><a href="sections/oncology.html" target="_blank">Çocuk Onkoloji</a></li>
                    </ul>
                </li>
                <li><a href="sections/doctors.html" target="_blank">Doktorlarımız</a></li>
                <li><a href="sections/nurses.html" target="_blank">Hemşirelerimiz</a></li>
                <li><a href="sections/news.html" target="_blank">Duyurular</a></li>
                <li><a href="sections/achievements.html" target="_blank">Başarılarımız</a></li>
            </ul>
        </div>
    </nav>
    <div class="main">
        <div class="panel-card">
            <div class="panel-card-header">
                <div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>
                <h2>Yeni Hemşire Ekle</h2>
            </div>
            <div class="panel-body">
                <div class="form-row">
                    <div>
                        <label>Hemşire Adı</label>
                        <select id="nurseName">
                            <option>Aylin</option><option>Elif</option><option>Zeynep</option><option>Ali</option>
                            <option>Merve</option><option>Canan</option><option>Fatma</option><option>Murat</option>
                            <option>Ahmet</option><option>Selin</option><option>Mustafa</option><option>Hamza</option>
                            <option>Nazım</option><option>Sedef</option>
                        </select>
                    </div>
                    <div>
                        <label>Vardiya</label>
                        <select id="nurseShift">
                            <option value="08:00-16:00">08:00 – 16:00</option>
                            <option value="16:00-00:00">16:00 – 00:00</option>
                            <option value="00:00-08:00">00:00 – 08:00</option>
                        </select>
                    </div>
                    <div>
                        <label>Bölüm</label>
                        <select id="nurseDepartment">
                            <option>Çocuk Acil Servisi</option>
                            <option>Çocuk Yoğun Bakım</option>
                            <option>Çocuk Onkoloji</option>
                        </select>
                    </div>
                    <div>
                        <label>Tarih</label>
                        <input type="date" id="nurseDate">
                    </div>
                </div>
                <button class="btn-add" onclick="addNurse()">+ Hemşire Ekle</button>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header">
                <div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></div>
                <h2>Hemşire Listesi</h2>
            </div>
            <div class="panel-body">
                <table>
                    <thead><tr><th>Ad</th><th>Vardiya</th><th>Bölüm</th><th>Tarih</th><th>İşlem</th></tr></thead>
                    <tbody id="nurseTableBody"></tbody>
                </table>
                <div class="empty-msg" id="emptyMsg" style="display:none;">Henüz hemşire eklenmedi.</div>
            </div>
        </div>
    </div>

    <script>
        function addNurse(){
            const name=document.getElementById('nurseName').value;
            const shift=document.getElementById('nurseShift').value;
            const dept=document.getElementById('nurseDepartment').value;
            const date=document.getElementById('nurseDate').value;
            if(!date){alert('Lütfen tarih seçin.');return;}
            const nurses=JSON.parse(localStorage.getItem('nurses')||'[]');
            if(nurses.some(n=>n.name===name&&n.date===date)){alert('Bu hemşire bu tarihte zaten eklenmiş.');return;}
            nurses.push({name,shift,department:dept,date});
            localStorage.setItem('nurses',JSON.stringify(nurses));
            document.getElementById('nurseDate').value='';
            renderTable();
        }
        function deleteNurse(i){
            const nurses=JSON.parse(localStorage.getItem('nurses')||'[]');
            nurses.splice(i,1);
            localStorage.setItem('nurses',JSON.stringify(nurses));
            renderTable();
        }
        function renderTable(){
            const nurses=JSON.parse(localStorage.getItem('nurses')||'[]');
            const tb=document.getElementById('nurseTableBody');
            const em=document.getElementById('emptyMsg');
            tb.innerHTML='';
            if(!nurses.length){em.style.display='block';return;}
            em.style.display='none';
            nurses.forEach((n,i)=>{
                tb.innerHTML+=`<tr><td>${n.name}</td><td>${n.shift}</td><td>${n.department}</td><td>${n.date}</td><td><button class="btn-delete" onclick="deleteNurse(${i})">Sil</button></td></tr>`;
            });
        }
        function logout(){window.location.href='index.html';}
        renderTable();
    </script>
</body>
</html>
