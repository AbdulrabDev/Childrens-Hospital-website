<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hemşire Paneli – Çocuk Hastanesi</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{--primary:#0A6EBD;--primary-dark:#054F8A;--primary-light:#E8F4FF;--teal:#00B4A6;--teal-light:#E0F7F6;--text-dark:#0D1B2A;--text-mid:#3D5268;--text-light:#7A92A8;--white:#FFFFFF;--bg:#F5F9FD;--border:rgba(10,110,189,0.12);--shadow-sm:0 2px 12px rgba(10,110,189,0.08);--shadow-md:0 8px 32px rgba(10,110,189,0.14);--radius:16px;--radius-sm:8px;--transition:all 0.35s cubic-bezier(0.4,0,0.2,1);}
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text-dark);}
        header{background:linear-gradient(135deg,#054F8A,var(--teal));padding:0;position:relative;overflow:hidden;}
        .header-inner{max-width:1400px;margin:0 auto;padding:18px 32px;display:flex;align-items:center;justify-content:space-between;}
        .header-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--white);}
        .logout-btn{background:rgba(255,255,255,0.15);color:var(--white);border:1.5px solid rgba(255,255,255,0.35);padding:8px 18px;border-radius:50px;font-family:'DM Sans',sans-serif;font-size:0.85rem;font-weight:600;cursor:pointer;transition:var(--transition);display:flex;align-items:center;gap:6px;}
        .logout-btn:hover{background:var(--white);color:var(--teal);}
        nav{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:var(--shadow-sm);}
        .nav-inner{max-width:1400px;margin:0 auto;padding:0 32px;display:flex;align-items:center;}
        nav ul{list-style:none;display:flex;gap:2px;}
        nav ul li{position:relative;}
        nav a{display:block;color:var(--text-mid);text-decoration:none;padding:14px 12px;font-size:0.84rem;font-weight:500;transition:var(--transition);white-space:nowrap;}
        nav a:hover{color:var(--primary);}
        .main{max-width:1400px;margin:32px auto;padding:0 32px;display:grid;grid-template-columns:1fr 1fr;gap:24px;}
        .panel-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--border);box-shadow:var(--shadow-sm);overflow:hidden;}
        .panel-card-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
        .panel-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
        .icon-teal{background:var(--teal-light);}
        .icon-teal svg{color:var(--teal);}
        .icon-blue{background:var(--primary-light);}
        .icon-blue svg{color:var(--primary);}
        .panel-icon svg{width:18px;height:18px;}
        .panel-card-header h2{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--text-dark);}
        .panel-body{padding:20px;}
        table{width:100%;border-collapse:collapse;}
        thead th{background:var(--teal);color:var(--white);padding:10px 12px;text-align:left;font-size:0.78rem;font-weight:600;}
        thead th:first-child{border-radius:8px 0 0 8px;}
        thead th:last-child{border-radius:0 8px 8px 0;}
        tbody td{padding:10px 12px;font-size:0.83rem;color:var(--text-mid);border-bottom:1px solid var(--border);}
        tbody tr:last-child td{border-bottom:none;}
        tbody tr:hover{background:var(--teal-light);}
        .bed-count{display:inline-block;padding:2px 10px;border-radius:50px;font-size:0.78rem;font-weight:700;}
        .bed-ok{background:var(--teal-light);color:var(--teal);}
        .bed-low{background:#FFF3E0;color:#E65100;}
        .empty-msg{text-align:center;color:var(--text-light);padding:24px;font-size:0.85rem;}
        @media(max-width:768px){.main{grid-template-columns:1fr;}}
    </style>
</head>
<body>
    <header>
        <div class="header-inner">
            <div class="header-title">Hemşire Paneli</div>
            <button class="logout-btn" onclick="logout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                Çıkış Yap
            </button>
        </div>
    </header>
    <nav>
        <div class="nav-inner">
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
                <li><a href="sections/doctors.html" target="_blank">Doktorlarımız</a></li>
                <li><a href="sections/nurses.html" target="_blank">Hemşirelerimiz</a></li>
                <li><a href="sections/news.html" target="_blank">Duyurular</a></li>
                <li><a href="sections/achievements.html" target="_blank">Başarılarımız</a></li>
            </ul>
        </div>
    </nav>
    <div class="main">
        <div class="panel-card">
            <div class="panel-card-header">
                <div class="panel-icon icon-teal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg></div>
                <h2>Hemşire Listesi</h2>
            </div>
            <div class="panel-body">
                <table>
                    <thead><tr><th>Ad</th><th>Vardiya</th><th>Bölüm</th><th>Tarih</th></tr></thead>
                    <tbody id="nurseTableBody"></tbody>
                </table>
                <div class="empty-msg" id="emptyMsg">Henüz hemşire eklenmedi.</div>
            </div>
        </div>
        <div class="panel-card">
            <div class="panel-card-header">
                <div class="panel-icon icon-blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
                <h2>Mevcut Yatak Sayısı</h2>
            </div>
            <div class="panel-body">
                <table>
                    <thead><tr><th>Bölüm</th><th>Mevcut Yatak</th></tr></thead>
                    <tbody id="bedTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function renderNurses(){
            const nurses=JSON.parse(localStorage.getItem('nurses')||'[]');
            const tb=document.getElementById('nurseTableBody');
            const em=document.getElementById('emptyMsg');
            tb.innerHTML='';
            if(!nurses.length){em.style.display='block';return;}
            em.style.display='none';
            nurses.forEach(n=>{
                tb.innerHTML+=`<tr><td>${n.name}</td><td>${n.shift}</td><td>${n.department}</td><td>${n.date}</td></tr>`;
            });
        }
        function renderBeds(){
            const beds=[
                {dept:'Çocuk Acil Servisi',n:Math.floor(Math.random()*10)},
                {dept:'Çocuk Yoğun Bakım',n:Math.floor(Math.random()*10)},
                {dept:'Çocuk Onkoloji',n:Math.floor(Math.random()*10)},
            ];
            document.getElementById('bedTableBody').innerHTML=beds.map(b=>
                `<tr><td>${b.dept}</td><td><span class="bed-count ${b.n>3?'bed-ok':'bed-low'}">${b.n} Yatak</span></td></tr>`
            ).join('');
        }
        function logout(){window.location.href='index.html';}
        renderNurses();
        renderBeds();
    </script>
</body>
</html>
